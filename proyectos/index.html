<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos · BarneyCalhoun⁸⁷²</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#dfe0d9; --panel:#eceee8; --ink:#1d2628; --muted:#556062;
  --signal:#e8590c; --on-signal:#1d1200; --line:#b9bcb2;
  --head:"Archivo","Segoe UI",Roboto,Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1a2123; --panel:#222b2d; --ink:#e7e9e2; --muted:#9aa5a6;
    --signal:#ff8a3d; --on-signal:#1d1200; --line:#36424a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1a2123; --panel:#222b2d; --ink:#e7e9e2; --muted:#9aa5a6;
  --signal:#ff8a3d; --on-signal:#1d1200; --line:#36424a; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}

/* Barra de navegación */
.nav{border-bottom:6px solid var(--signal)}
.nav .wrap{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;padding-top:1rem;padding-bottom:1rem}
.brand{font:900 1.2rem/1 var(--head);text-decoration:none;margin-right:auto}
.brand sup{color:var(--signal);font-size:.6em}
.nav a.link{font:700 1rem/1 var(--head);text-decoration:none;padding:.4rem 0;border-bottom:3px solid transparent}
.nav a.link[aria-current="page"]{border-color:var(--signal)}

/* Cabecera */
.top{padding:3rem 0 1.5rem}
h1{font:900 clamp(2.2rem,10vw,4.5rem)/1.05 var(--head);margin:0 0 1rem}
.lead{max-width:34rem;color:var(--muted);margin:0}

/* Lista desplegable */
.list{margin:1.5rem 0 3rem;border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line);background:transparent}
details[open]{background:var(--panel)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.5rem 1fr auto;gap:.25rem 1rem;align-items:center;padding:1.2rem .25rem}
summary::-webkit-details-marker{display:none}
summary h2{font:700 clamp(1.15rem,4.5vw,1.6rem)/1.15 var(--head);margin:0}
.logo{grid-column:1;grid-row:1 / span 2;width:3.5rem;height:3.5rem;object-fit:cover;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center;font:900 1.6rem/1 var(--head);color:var(--signal)}
.kind{font:700 .8rem/1 var(--head);background:var(--ink);color:var(--paper);padding:.35rem .55rem;justify-self:end}
.desc{grid-column:2;margin:0;color:var(--muted);font-size:.98rem}
.chev{grid-column:3;grid-row:2;justify-self:end;width:1.4rem;height:1.4rem;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.chev path{fill:none;stroke:var(--signal);stroke-width:3}
.body{display:grid;gap:1.5rem;padding:.5rem .25rem 1.75rem}
@media(min-width:48rem){.body{grid-template-columns:1.4fr 1fr;align-items:start}}
.video{aspect-ratio:16/9;background:var(--ink);border:1px solid var(--line);display:grid;place-items:center;color:var(--paper);text-align:center;padding:1rem}
.video iframe{width:100%;height:100%;border:0;display:block}
.dl h3{font:900 1.2rem/1.1 var(--head);margin:0 0 .75rem}
.dl ul{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.dl a{display:block;background:var(--signal);color:var(--on-signal);font:700 1rem/1.2 var(--head);text-decoration:none;padding:.85rem 1rem;border:3px solid var(--ink)}
.dl a:hover{background:var(--ink);color:var(--paper)}
.dl small{display:block;font:400 .85rem/1.3 var(--body);margin-top:.25rem;opacity:.85}
.watch{display:inline-block;margin-top:.6rem;font-size:.95rem;color:var(--muted)}
.empty{color:var(--muted)}
footer{padding:2rem 0 2.5rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
footer p{margin:.25rem 0}
</style>
</head>

}

PROYECTOS.forEach(function (p) {
  const d = document.createElement("details");
  d.id = p.id;

  const s = document.createElement("summary");
  let logo;
  if (p.logo) {
    logo = document.createElement("img");
    logo.src = p.logo;
    logo.alt = "";
    logo.loading = "lazy";
  } else {
    logo = crear("div", "", p.titulo.trim().charAt(0).toUpperCase());
    logo.setAttribute("aria-hidden", "true");
  }
  logo.classList.add("logo");
  s.appendChild(logo);
  s.appendChild(crear("h2", "", p.titulo));
  s.appendChild(crear("span", "kind", p.tipo));
  s.appendChild(crear("p", "desc", p.descripcion));
  s.insertAdjacentHTML("beforeend",
    '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8 8 8-8"/></svg>');
  d.appendChild(s);

  const cuerpo = crear("div", "body");
  const caja = crear("div", "video");
  const dl = crear("div", "dl");
  dl.appendChild(crear("h3", "", "Descargas"));
  const ul = document.createElement("ul");
  (p.descargas || []).forEach(function (x) {
    const li = document.createElement("li");
    const a = crear("a", "", x.texto);
    a.href = x.url;
    a.target = "_blank";
    a.rel = "noopener";
    if (x.nota) a.appendChild(crear("small", "", x.nota));
    li.appendChild(a);
    ul.appendChild(li);
  });
  dl.appendChild(ul);
  if (p.video) {
    const w = crear("a", "watch", "Ver en YouTube");
    w.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(p.video);
    w.target = "_blank";
    w.rel = "noopener";
    dl.appendChild(w);
  }
  cuerpo.appendChild(caja);
  cuerpo.appendChild(dl);
  d.appendChild(cuerpo);

  /* El vídeo se carga solo al abrir el proyecto */
  let cargado = false;
  d.addEventListener("toggle", function () {
    if (d.open && !cargado) { ponerVideo(caja, p); cargado = true; }
  });

  lista.appendChild(d);
});

/* Si la dirección trae #id, abre ese proyecto directamente */
if (location.hash) {
  const objetivo = document.getElementById(location.hash.slice(1));
  if (objetivo && objetivo.tagName === "DETAILS") {
    objetivo.open = true;
    objetivo.scrollIntoView();
  }
}
</script>
</body>
</html>
